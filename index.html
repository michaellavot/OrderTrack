<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>OrderTrack</title><link rel="manifest" href="manifest.json"><style>body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui}.app{max-width:680px;margin:auto;padding:20px 16px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}.count,.card{background:#171b21;border:1px solid #29313a;border-radius:18px}.count{padding:9px 13px}.card{padding:16px;margin:12px 0}.shop{font-weight:700;font-size:17px}.product{color:#c7cbd1;margin:6px 0 12px}.status{color:#9da6b2;font-size:13px}.meta{color:#89929e;font-size:12px;margin-top:18px}</style></head><body><main class="app"><header><h1>📦 OrderTrack</h1><div class="count">5 פתוחות</div></header><div id="orders"></div><div class="meta" id="updated"></div></main><script>const orders=[{shop:'Future Audio Video',product:'Fosi Audio ZA3 + כבל RCA',status:'ממתין לעדכון משלוח',price:'₪889'},{shop:'מחסני חשמל',product:'פח ARPO 70L',status:'פנייה 4283701 בטיפול',price:'₪249'},{shop:'BoomBuy',product:'סט 3 מחבתות Eisenthal',status:'ממתין למשלוח',price:'₪180'},{shop:'התקליטים שלי',product:'4 תקליטי ויניל',status:'ממתין לעדכון משלוח',price:'₪703'},{shop:'Grooves.land',product:'The Steel Woods + Warren Zeiders',status:'בדרך לישראל',price:'€68.63'}];document.getElementById('orders').innerHTML=orders.map(o=>'<div class="card"><div class="shop">'+o.shop+' · '+o.price+'</div><div class="product">'+o.product+'</div><div class="status">'+o.status+'</div></div>').join('');document.getElementById('updated').textContent='עודכן: '+new Date().toLocaleString('he-IL');if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
